<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ .Site.Title }}</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, system-ui, sans-serif; max-width: 640px; margin: 0 auto; padding: 2rem 1rem; color: #111; background: #fff; }
    a { color: #0066cc; text-decoration: none; }
    a:hover { text-decoration: underline; }
    header { margin-bottom: 2rem; }
    header h1 { font-size: 1.5rem; }
    header p { color: #666; margin-top: 0.25rem; }
    ul { list-style: none; }
    li { margin-bottom: 1.25rem; }
    .post-date { color: #888; font-size: 0.875rem; }
    .post-title { font-size: 1.125rem; font-weight: 600; }
    footer { margin-top: 3rem; color: #888; font-size: 0.8rem; }
  </style>
</head>
<body>
  {{ block "main" . }}{{ end }}
  <footer>{{ .Site.Copyright }}</footer>
</body>
</html>
