{{ define "main" }}
<header>
  <h1><a href="{{ .Site.BaseURL }}">{{ .Site.Title }}</a></h1>
  {{ with .Site.Params.description }}<p>{{ . }}</p>{{ end }}
</header>
<ul>
  {{ range .Site.RegularPages }}
  <li>
    <span class="post-date">{{ .Date.Format "2006-01-02" }}</span>
    <a class="post-title" href="{{ .RelPermalink }}">{{ .Title }}</a>
  </li>
  {{ end }}
</ul>
{{ end }}
